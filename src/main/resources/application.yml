spring:
  application:
    name: data-management-service
  rabbitmq:
    host: 204.168.203.32
    port: 5672
    username: subscriber
    password: ${RABBITMQ_PASSWORD:}
    listener:
      simple:
        acknowledge-mode: manual
        # Instrumenta cada mensaje consumido => timer spring.rabbitmq.listener,
        # que Prometheus ve como spring_rabbitmq_listener_seconds_*. Es la métrica
        # con la que se mide throughput/latencia del consumer en el Sistema A.
        observation-enabled: true
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://204.168.203.32:3306/data_management_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: landslide
    password: ${MYSQL_PASSWORD:}

mybatis:
  mapper-locations: classpath:mapper/*.xml

server:
  port: 8082

app:
  rabbitmq:
    listeners:
      enabled: ${RABBITMQ_LISTENERS_ENABLED:true}
      concurrency: ${RABBITMQ_LISTENER_CONCURRENCY:4}
      max-concurrency: ${RABBITMQ_LISTENER_MAX_CONCURRENCY:8}
      prefetch: ${RABBITMQ_LISTENER_PREFETCH:50}
  consul:
    enabled: ${CONSUL_ENABLED:true}
    base-url: ${CONSUL_BASE_URL:http://localhost:8500}
    token: ${CONSUL_HTTP_TOKEN:}
    # DEBE ser data-management-service: es el nombre por el que consul-template
    # arma el upstream de nginx (`range service "data-management-service|passing"`).
    # Registrarse como "data-management" deja al template sin backends y el
    # gateway sin upstream, aunque el servicio este perfectamente sano.
    service-name: ${CONSUL_SERVICE_NAME:data-management-service}
    service-ip: ${SERVICE_IP:}
    health-path: /health
    interval: 10s
    # heartbeat + deregister-after = auto-recuperacion: si la instancia queda
    # critical (congelada, caida) Consul la saca a los 30s y nginx deja de
    # mandarle trafico; cuando revive, el heartbeat la re-registra en <=10s sin
    # intervencion. Sin heartbeat, una instancia desregistrada no vuelve nunca
    # (paso el 2026-07-16: el sistema corrio a media capacidad ~7h sin aviso).
    heartbeat-ms: 10000
    deregister-after: 30s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Prometheus del Sistema A scrapea http://localhost:8082/metrics (y :8086), NO
# /actuator/prometheus. Por eso se saca el base-path /actuator y se mapea el
# endpoint prometheus a /metrics: así el scrape config existente funciona sin
# tocarlo. Solo se expone prometheus — health sigue siendo el controller propio
# (/health), que ya lo usan Consul y los scripts de chaos; exponer el health de
# actuator acá colisionaría con ese mapping.
management:
  endpoints:
    web:
      base-path: /
      path-mapping:
        prometheus: metrics
      exposure:
        include: prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        dm.persist.latency: true
        http.server.requests: true
      slo:
        dm.persist.latency: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5000ms
        # http.server.requests: mismos cortes que el histograma HTTP de los 4
        # servicios Go (Sistema B) y del resto de servicios Spring/Flask de
        # Sistema A, para que histogram_quantile sea comparable entre sistemas.
        http.server.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5000ms
