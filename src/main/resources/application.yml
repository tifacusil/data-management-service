spring:
  application:
    name: data-management-service
  rabbitmq:
    host: 204.168.203.32
    port: 5672
    username: subscriber
    password: ${RABBITMQ_PASSWORD:}
    listener:
      simple:
        acknowledge-mode: manual
        # Instrumenta cada mensaje consumido => timer spring.rabbitmq.listener,
        # que Prometheus ve como spring_rabbitmq_listener_seconds_*. Es la métrica
        # con la que se mide throughput/latencia del consumer en el Sistema A.
        observation-enabled: true
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://204.168.203.32:3306/data_management_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: landslide
    password: ${MYSQL_PASSWORD:}

mybatis:
  mapper-locations: classpath:mapper/*.xml

server:
  port: 8082

# Prometheus del Sistema A scrapea http://localhost:8082/metrics (y :8086), NO
# /actuator/prometheus. Por eso se saca el base-path /actuator y se mapea el
# endpoint prometheus a /metrics: así el scrape config existente funciona sin
# tocarlo. Solo se expone prometheus — health sigue siendo el controller propio
# (/health), que ya lo usan Consul y los scripts de chaos; exponer el health de
# actuator acá colisionaría con ese mapping.
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: prometheus
      path-mapping:
        prometheus: metrics

app:
  rabbitmq:
    listeners:
      enabled: ${RABBITMQ_LISTENERS_ENABLED:true}
      concurrency: ${RABBITMQ_LISTENER_CONCURRENCY:4}
      max-concurrency: ${RABBITMQ_LISTENER_MAX_CONCURRENCY:8}
      prefetch: ${RABBITMQ_LISTENER_PREFETCH:50}
  consul:
    enabled: ${CONSUL_ENABLED:true}
    base-url: ${CONSUL_BASE_URL:http://localhost:8500}
    token: ${CONSUL_HTTP_TOKEN:}
    service-name: data-management
    service-ip: ${SERVICE_IP:}
    health-path: /health
    interval: 10s
    heartbeat-ms: 10000
    deregister-after: 30s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
